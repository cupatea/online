name: Build & push images

on:
  push:
    branches: [main]
    paths:
      - caddy/**
      - admin/**
      - .github/workflows/build.yml
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # Each entry maps to one GHCR package:
        #   ghcr.io/<owner>/nas-caddy
        #   ghcr.io/<owner>/nas-admin
        component:
          - { name: caddy, context: ./caddy }
          - { name: admin, context: ./admin }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nas-${{ matrix.component.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Multi-arch keeps the same image usable on x86 NAS, Pi, M-series.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
