services:
  app:
    image: ghcr.io/cupatea/online:latest
    container_name: online
    restart: unless-stopped
    environment:
      # Generate with: bin/rails runner 'puts BCrypt::Password.create("your password")'
      # Prefer ADMIN_PASSWORD_DIGEST_FILE with a Docker secret in production.
      ADMIN_PASSWORD_DIGEST: "${ADMIN_PASSWORD_DIGEST:?Set ADMIN_PASSWORD_DIGEST}"
    # Explicit port mappings instead of network_mode: host so the same compose
    # file works on Docker Desktop (macOS/Windows) where host networking lives
    # in a hidden Linux VM and isn't reachable from the host OS.
    #
    # In the admin UI, set each service's "upstream host" to
    # `host.docker.internal` (Docker Desktop's name for the host machine) so
    # Caddy can reach services running on the host. On Linux Docker, add
    # `extra_hosts: ["host.docker.internal:host-gateway"]` below to enable
    # the same name there.
    ports:
      - "80:80"
      - "443:443"
      - "3003:3003"
      # Optional: only needed to reach the dashboard launcher *directly* at
      # http://<host>:3004. The usual path doesn't need this — point a Caddy
      # service at upstream localhost:3004 and the dashboard is served over the
      # in-container loopback.
      # - "3004:3004"
    volumes:
      - online_data:/rails/storage

volumes:
  online_data:
